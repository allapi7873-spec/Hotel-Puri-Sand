<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Puri Sands - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'luxury-black': '#050505',
                        'luxury-charcoal': '#121212',
                        'gold': '#D4AF37',
                        'gold-light': '#F3E5AB',
                    },
                    fontFamily: {
                        'title': ['Cinzel', 'serif'],
                        'body': ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #050505; color: #fff; }
        .font-title { font-family: 'Cinzel', serif; }
        .bg-gold-gradient { background: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C); }
        .glass-panel { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.2); }
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="flex-1 w-full flex items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-2xl max-w-sm w-full text-center">
            <i class="fa-solid fa-crown text-gold text-4xl mb-4"></i>
            <h1 class="font-title text-2xl text-gold mb-2">Admin Login</h1>
            <p class="text-gray-500 text-xs mb-6">Hotel Puri Sands Management</p>
            <input type="text" id="adminUsername" placeholder="Enter Username" 
                   class="w-full bg-black/50 border border-gold/30 rounded-lg px-4 py-3 mb-3 text-white focus:outline-none focus:border-gold">
            <input type="password" id="adminPassword" placeholder="Enter Password" 
                   class="w-full bg-black/50 border border-gold/30 rounded-lg px-4 py-3 mb-4 text-white focus:outline-none focus:border-gold"
                   onkeydown="if(event.key==='Enter') login()">
            <button onclick="login()" class="w-full bg-gold-gradient text-black font-bold py-3 rounded-lg hover:opacity-90 transition">
                <i class="fa-solid fa-right-to-bracket mr-2"></i>Access Dashboard
            </button>
            <p id="loginError" class="text-red-500 text-sm mt-3 hidden">Incorrect Username or Password!</p>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboardScreen" class="w-full max-w-6xl p-4 md:p-8 hidden">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 glass-panel p-6 rounded-2xl">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <i class="fa-solid fa-crown text-gold text-3xl"></i>
                <div>
                    <h1 class="font-title text-2xl text-gold">Admin Dashboard</h1>
                    <p class="text-gray-400 text-sm">Hotel Puri Sands Management</p>
                </div>
            </div>
            <button onclick="logout()" class="px-4 py-2 border border-red-500/50 text-red-400 rounded-lg hover:bg-red-500/10 transition">
                <i class="fa-solid fa-power-off mr-2"></i>Logout
            </button>
        </div>

        <!-- Tabs -->
        <div class="flex gap-4 mb-6">
            <button onclick="switchTab('orders')" id="tab-orders" class="flex-1 md:flex-none px-6 py-3 rounded-lg font-bold transition bg-gold text-black">
                <i class="fa-solid fa-utensils mr-2"></i> Food Orders
            </button>
            <button onclick="switchTab('bookings')" id="tab-bookings" class="flex-1 md:flex-none px-6 py-3 rounded-lg font-bold transition glass-panel text-gold hover:bg-gold/10">
                <i class="fa-solid fa-bed mr-2"></i> Room Bookings
            </button>
        </div>

        <!-- Orders Section -->
        <div id="ordersSection" class="glass-panel rounded-2xl overflow-hidden">
            <div class="overflow-x-auto no-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-black/40 text-gold text-sm uppercase tracking-wider">
                            <th class="p-4">Date</th>
                            <th class="p-4">Customer</th>
                            <th class="p-4">Room/Contact</th>
                            <th class="p-4">Items</th>
                            <th class="p-4">Total</th>
                            <th class="p-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody" class="text-sm divide-y divide-gold/10">
                        <!-- Orders injected here -->
                    </tbody>
                </table>
            </div>
            <div id="ordersLoading" class="p-8 text-center text-gold"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>
        </div>

        <!-- Bookings Section -->
        <div id="bookingsSection" class="glass-panel rounded-2xl overflow-hidden hidden">
            <div class="overflow-x-auto no-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-black/40 text-gold text-sm uppercase tracking-wider">
                            <th class="p-4">Date Requested</th>
                            <th class="p-4">Customer</th>
                            <th class="p-4">Check In/Out</th>
                            <th class="p-4">Room Type</th>
                            <th class="p-4">Status</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsBody" class="text-sm divide-y divide-gold/10">
                        <!-- Bookings injected here -->
                    </tbody>
                </table>
            </div>
            <div id="bookingsLoading" class="p-8 text-center text-gold"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>
        </div>

    </div>

    <script>
        // BACKEND URL - CHANGE THIS WHEN DEPLOYED TO RENDER
        // const BACKEND_URL = 'https://hotel-puri-sand-backend.onrender.com';
        const BACKEND_URL = 'http://localhost:5000';

        // --- Login Logic ---
        function login() {
            const user = document.getElementById('adminUsername').value.trim();
            const pwd = document.getElementById('adminPassword').value;
            if (user === 'admin' && pwd === 'admin') { // Admin credentials
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                fetchData();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function logout() {
            document.getElementById('adminUsername').value = '';
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('dashboardScreen').classList.add('hidden');
        }

        // --- Tab Logic ---
        function switchTab(tab) {
            const btnOrders = document.getElementById('tab-orders');
            const btnBookings = document.getElementById('tab-bookings');
            const secOrders = document.getElementById('ordersSection');
            const secBookings = document.getElementById('bookingsSection');

            if (tab === 'orders') {
                btnOrders.className = "flex-1 md:flex-none px-6 py-3 rounded-lg font-bold transition bg-gold text-black";
                btnBookings.className = "flex-1 md:flex-none px-6 py-3 rounded-lg font-bold transition glass-panel text-gold hover:bg-gold/10";
                secOrders.classList.remove('hidden');
                secBookings.classList.add('hidden');
            } else {
                btnBookings.className = "flex-1 md:flex-none px-6 py-3 rounded-lg font-bold transition bg-gold text-black";
                btnOrders.className = "flex-1 md:flex-none px-6 py-3 rounded-lg font-bold transition glass-panel text-gold hover:bg-gold/10";
                secBookings.classList.remove('hidden');
                secOrders.classList.add('hidden');
            }
        }

        // --- Fetch Data ---
        async function fetchData() {
            fetchOrders();
            fetchBookings();
        }

        async function fetchOrders() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/orders`);
                const data = await res.json();
                
                document.getElementById('ordersLoading').classList.add('hidden');
                const tbody = document.getElementById('ordersBody');
                tbody.innerHTML = '';

                if (data.success && data.orders.length > 0) {
                    data.orders.forEach(order => {
                        const date = new Date(order.createdAt).toLocaleString('en-IN');
                        let itemsHtml = order.items.map(i => `${i.name} (x${i.quantity})`).join('<br>');
                        
                        tbody.innerHTML += `
                            <tr class="hover:bg-white/5 transition">
                                <td class="p-4 whitespace-nowrap text-gray-400">${date}</td>
                                <td class="p-4 font-bold text-white">${order.customerName}</td>
                                <td class="p-4 text-gray-300">Room: <span class="text-gold">${order.deliveryAddress}</span><br><span class="text-xs text-gray-500">${order.contactNumber}</span></td>
                                <td class="p-4 text-xs text-gray-300 leading-relaxed">${itemsHtml}</td>
                                <td class="p-4 font-bold text-gold">₹${order.totalAmount}</td>
                                <td class="p-4"><span class="px-2 py-1 rounded bg-yellow-500/20 text-yellow-400 text-xs">${order.orderStatus}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">No orders found.</td></tr>`;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('ordersLoading').innerHTML = `<span class="text-red-500">Failed to load orders.</span>`;
            }
        }

        async function fetchBookings() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/bookings`);
                const data = await res.json();
                
                document.getElementById('bookingsLoading').classList.add('hidden');
                const tbody = document.getElementById('bookingsBody');
                tbody.innerHTML = '';

                if (data.success && data.bookings.length > 0) {
                    data.bookings.forEach(b => {
                        const date = new Date(b.createdAt).toLocaleString('en-IN');
                        tbody.innerHTML += `
                            <tr class="hover:bg-white/5 transition">
                                <td class="p-4 whitespace-nowrap text-gray-400">${date}</td>
                                <td class="p-4 font-bold text-white">${b.customerName}</td>
                                <td class="p-4 text-gray-300">
                                    <div class="flex items-center gap-2"><i class="fa-solid fa-arrow-right-to-bracket text-green-500"></i> ${b.checkIn}</div>
                                    <div class="flex items-center gap-2 mt-1"><i class="fa-solid fa-arrow-right-from-bracket text-red-500"></i> ${b.checkOut}</div>
                                </td>
                                <td class="p-4 text-gold">${b.roomCategory}</td>
                                <td class="p-4"><span class="px-2 py-1 rounded bg-yellow-500/20 text-yellow-400 text-xs">${b.bookingStatus}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">No bookings found.</td></tr>`;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('bookingsLoading').innerHTML = `<span class="text-red-500">Failed to load bookings.</span>`;
            }
        }
    </script>
</body>
</html>
